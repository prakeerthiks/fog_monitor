<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Dino Quiz</title>
  <style>
    /* Praky's Arcade design system: fonts + tokens */
    @font-face { font-family: 'Lilita One'; src: url('/fonts/LilitaOne-Regular.ttf') format('truetype'); font-display: swap; }
    @font-face { font-family: 'Chunky Hand'; src: url('/fonts/ChunkyHand-Uniform.ttf') format('truetype'); font-display: swap; }
    :root {
      --cream-100: #faf6e6; --cream-50: #fef8ec;
      --lavender-300: #d2bbff; --lilac-100: #efd8f7;
      --forest-ink: #516953; --cocoa-ink: #635555; --olive-ink: #5e5d2f; --outline-brown: #4a4138;
      --quokka-blush: #fcab82; --pixel-sky: #0087fe; --pixel-teal: #00c49c; --pixel-plum: #2e1b5b;
      --font-display: 'Lilita One', 'Arial Rounded MT Bold', system-ui, sans-serif;
      --font-hand: 'Chunky Hand', 'Comic Neue', system-ui, sans-serif;
      --stroke-hand: 5px; --radius-bubble: 40px; --radius-pill: 999px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: var(--font-hand); color: var(--olive-ink); }
    body { background: var(--pixel-sky); touch-action: none; }
    canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

    /* top bar */
    #bar { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 0; right: 0; display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap; padding: 0 12px; z-index: 5; }
    .chip { font: 400 20px/1 var(--font-hand); letter-spacing: .02em; padding: 10px 18px 12px; border-radius: var(--radius-pill); border: 4px solid var(--outline-brown); background: var(--cream-50); color: var(--olive-ink); cursor: pointer; box-shadow: inset 0 -6px 0 var(--lilac-100); transition: transform .15s; }
    .chip:hover, .chip.hover { transform: translateY(-3px) rotate(-1deg); }
    .chip.active { background: var(--lilac-100); box-shadow: inset 0 -6px 0 var(--lavender-300); }
    .chip.icon { padding: 10px 14px 12px; }

    #hint { position: fixed; bottom: max(14px, env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; color: var(--cream-50); font-size: 19px; text-shadow: 0 2px 0 var(--outline-brown); z-index: 4; pointer-events: none; transition: opacity .5s; }

    /* dialogue bubble (design-system component) */
    #bubble { position: fixed; z-index: 6; right: 4vw; top: 50%; width: min(500px, 92vw); transform: translateY(-46%) scale(.9); opacity: 0; pointer-events: none; transition: opacity .35s, transform .45s cubic-bezier(.3,1.4,.5,1); }
    #bubble.open { opacity: 1; transform: translateY(-50%) scale(1); pointer-events: auto; }
    .bubble { position: relative; background: var(--cream-50); border: var(--stroke-hand) solid var(--outline-brown); border-radius: var(--radius-bubble); box-shadow: inset 0 -14px 0 var(--lilac-100); padding: 34px 26px 38px; }
    #who { position: absolute; left: 30px; top: -22px; background: var(--lilac-100); border: 5px solid var(--outline-brown); border-radius: var(--radius-pill); padding: 2px 22px 4px; font-size: 26px; letter-spacing: .03em; line-height: 1.2; }
    #qcount { position: absolute; right: 26px; top: -18px; background: var(--cream-100); border: 4px solid var(--outline-brown); border-radius: var(--radius-pill); padding: 1px 14px 3px; font-size: 20px; }
    #qtext { font-size: 30px; line-height: 1.25; min-height: 2.6em; }
    #qtext .hide { opacity: 0; }
    #opts { margin-top: 10px; transition: opacity .3s; }
    #opts.wait { opacity: 0; pointer-events: none; }
    .opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; font: 400 24px/1.15 var(--font-hand); color: var(--olive-ink); background: var(--cream-100); border: 4px solid var(--outline-brown); border-radius: 22px; padding: 10px 14px 12px; margin-bottom: 10px; cursor: pointer; transition: transform .15s, background .2s; }
    .opt b { flex: none; width: 34px; height: 34px; line-height: 32px; text-align: center; font-weight: 400; background: var(--lilac-100); border: 3px solid var(--outline-brown); border-radius: var(--radius-pill); font-size: 20px; }
    .opt.hover { transform: scale(1.03) rotate(-.6deg); background: var(--lilac-100); }
    .opt.good { background: #bff3e3; border-color: var(--forest-ink); }
    .opt.bad { background: var(--quokka-blush); animation: shake .4s; }
    @keyframes shake { 25% { transform: translateX(-7px) rotate(-1deg); } 75% { transform: translateX(7px) rotate(1deg); } }
    #qfeed { font-size: 22px; min-height: 1.5em; margin-top: 2px; color: var(--cocoa-ink); }
    .btns { display: flex; justify-content: center; margin-top: 8px; }
    .pill { font: 400 20px/1 var(--font-hand); padding: 9px 20px 11px; background: var(--lilac-100); border: 4px solid var(--outline-brown); border-radius: var(--radius-pill); color: var(--olive-ink); cursor: pointer; }
    .pill:hover { transform: translateY(-2px); }

    /* hands */
    #cam { position: fixed; left: 14px; bottom: 14px; width: 150px; border-radius: 22px; border: 4px solid var(--outline-brown); transform: scaleX(-1); z-index: 5; display: none; background: var(--pixel-plum); opacity: .92; }
    #cursor { position: fixed; left: 0; top: 0; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; z-index: 30; pointer-events: none; display: none; border: 5px solid var(--outline-brown); background: conic-gradient(#f7e05a calc(var(--p, 0) * 360deg), #fef8ecaa 0); }
    #cursor::after { content: ''; position: absolute; inset: 11px; border-radius: 50%; background: var(--cream-50); border: 3px solid var(--outline-brown); }
    #cursor.palm { background: conic-gradient(#fc85ff calc(var(--p, 0) * 360deg), #fef8ecaa 0); }
    #toast { position: fixed; top: 78px; left: 50%; transform: translateX(-50%); z-index: 25; background: var(--cream-50); border: 4px solid var(--outline-brown); color: var(--olive-ink); font-size: 20px; padding: 8px 18px 10px; border-radius: var(--radius-pill); display: none; max-width: 90vw; text-align: center; }


    /* stage: everything of the game lives here (fixed-fullscreen, or a 9:16 reel frame) */
    #stage { position: fixed; inset: 0; transform: translateZ(0); overflow: hidden; z-index: 1; }

    /* REEL MODE: 9:16 frame, your camera on the top half, the game on the bottom half */
    body.reel { background: #111; }
    body.reel #stage { inset: auto; background: var(--pixel-sky); }
    body.reel #cam { display: block !important; position: absolute; left: 0; top: 0; width: 100%; height: 50%; object-fit: cover; border: 0; border-radius: 0; opacity: 1; z-index: 1; background: var(--pixel-plum); }
    body.reel canvas#gl { position: absolute; left: 0; top: 50%; width: 100%; height: 50%; }
    body.reel #bar { display: none; } /* in reel mode you point at a fish to pick it */
    body.reel .chip { font-size: 22px; padding: 4px 12px 7px; border-width: 3px; box-shadow: inset 0 -4px 0 var(--lilac-100); white-space: nowrap; }
    body.reel .chip .lb { display: none; }
    body.reel .chip.icon { display: none; }
    body.reel #hint { display: none; }
    body.reel #bubble { position: absolute; right: auto; left: 50%; top: auto; bottom: 10px; width: 94%; transform: translateX(-50%) scale(.9); }
    body.reel #bubble.open { transform: translateX(-50%) scale(1); }
    body.reel .bubble { padding: 20px 12px 18px; border-width: 4px; border-radius: 30px; box-shadow: inset 0 -8px 0 var(--lilac-100); }
    body.reel #who { font-size: 18px; top: -18px; left: 20px; border-width: 4px; }
    body.reel #qcount { font-size: 15px; top: -14px; right: 18px; border-width: 3px; }
    body.reel #qtext { font-size: 18px; line-height: 1.15; min-height: 2.3em; }
    body.reel .opt { font-size: 15px; padding: 2px 8px 4px; margin-bottom: 4px; border-width: 3px; border-radius: 16px; gap: 8px; }
    body.reel .opt b { width: 20px; height: 20px; line-height: 17px; font-size: 12px; border-width: 2px; }
    body.reel #opts { margin-top: 4px; }
    body.reel #qfeed { font-size: 14px; min-height: 1.2em; margin-top: 0; }
    body.reel .btns { display: none; }

    @media (max-aspect-ratio: 1/1) {
      #bubble { right: 50%; left: auto; top: auto; bottom: max(24px, env(safe-area-inset-bottom)); transform: translateX(50%) scale(.9); width: min(94vw, 500px); }
      #bubble.open { transform: translateX(50%) scale(1); }
      #qtext { font-size: 25px; }
      .opt { font-size: 21px; padding: 8px 12px 10px; }
      #hint { display: none; }
    }

    /* start card: Level title card */
    #start { position: fixed; inset: 0; z-index: 20; background: var(--cream-100); transition: opacity .8s; cursor: pointer; overflow: hidden; }
    #start.gone { opacity: 0; pointer-events: none; }
    #startpx { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
    #startgrid { position: relative; z-index: 2; height: 100%; display: grid; grid-template-columns: 1fr 1fr; align-items: center; padding: 0 6vw 6vh; gap: 4vw; }
    #blob { justify-self: center; width: min(40vw, 420px); aspect-ratio: 1; background: var(--lavender-300); border-radius: 58% 42% 55% 45% / 48% 56% 44% 52%; display: grid; place-items: center; }
    #blob canvas { width: 70%; image-rendering: pixelated; animation: bob 1.4s steps(2) infinite; }
    @keyframes bob { 50% { transform: translateY(-8px); } }
    #lvl { font: 400 clamp(54px, 11vw, 120px)/1 var(--font-display); color: var(--forest-ink); margin: 0; }
    #topic { font: 400 clamp(48px, 10vw, 112px)/1.05 var(--font-hand); letter-spacing: .02em; color: var(--cocoa-ink); margin: 14px 0 0; }
    #press { display: inline-block; margin-top: 26px; font: 400 28px/1 var(--font-hand); padding: 12px 28px 14px; background: var(--lilac-100); border: 5px solid var(--outline-brown); border-radius: var(--radius-pill); color: var(--olive-ink); box-shadow: inset 0 -8px 0 var(--lavender-300); animation: bob 1.4s steps(2) infinite; }
    @media (max-aspect-ratio: 1/1) {
      #startgrid { grid-template-columns: 1fr; justify-items: center; text-align: center; align-content: center; }
      #blob { width: 60vw; }
    }
  </style>
</head>
<body>
  <div id="stage">
  <video id="cam" playsinline muted></video>
  <canvas id="gl"></canvas>

  <div id="bar"></div>
  <div id="hint">Pick a fish to start its dino quiz · Esc sends the fish home<br>🖐 Hands (always on): point &amp; hold to choose · open hand = bye</div>

  <div id="bubble" aria-live="polite">
    <div class="bubble">
      <div id="who"></div>
      <div id="qcount"></div>
      <div id="qtext"></div>
      <div id="opts" class="wait"></div>
      <div id="qfeed"></div>
      <div class="btns"><button class="pill" id="done">bye! 🖐</button></div>
    </div>
  </div>

  </div>

  <div id="cursor"></div>
  <div id="toast"></div>

  <div id="start">
    <canvas id="startpx"></canvas>
    <div id="startgrid">
      <div id="blob"><canvas id="dino"></canvas></div>
      <div>
        <h1 id="lvl">Level 1</h1>
        <p id="topic">dinosaurs</p>
        <span id="press">Press start!</span>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
