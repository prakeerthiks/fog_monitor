<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AI Aquarium</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #3b2a1a;
      --paper: #fff3d6;
      --paper-edge: #f0d9a0;
      --wood: #b9773a;
      --wood-dark: #7d4a1f;
      --chip: #ffffffcc;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: 'Baloo 2', system-ui, sans-serif; }
    body { background: linear-gradient(#8fe9ff 0%, #36b6e6 40%, #1368b5 100%); color: var(--ink); touch-action: none; }
    canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

    /* top bar */
    #bar { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 0; right: 0; display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap; padding: 0 12px; z-index: 5; }
    .chip { font: 700 17px/1 'Baloo 2', sans-serif; padding: 11px 18px; border-radius: 14px; border: 3px solid #fff; background: var(--chip); color: #0b4a7a; cursor: pointer; box-shadow: 0 4px 0 #0b4a7a55; transition: transform .15s, background .2s; }
    .chip:hover { transform: translateY(-2px); background: #fff; }
    .chip.active { background: #ffd23f; border-color: #fff7c9; color: #5a3b00; }
    .chip.icon { padding: 11px 14px; }

    #hint { position: fixed; bottom: max(14px, env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; color: #fff; font-weight: 700; font-size: 15px; text-shadow: 0 2px 0 #0b4a7a99; z-index: 4; pointer-events: none; transition: opacity .5s; }

    /* scroll */
    #scroll { position: fixed; z-index: 6; right: 3vw; top: 52%; width: min(460px, 92vw); transform: translateY(-50%); pointer-events: none; }
    #scroll .rod { height: 20px; border-radius: 10px; background: linear-gradient(#d9954f, var(--wood) 55%, var(--wood-dark)); box-shadow: 0 5px 0 #0003; position: relative; z-index: 2; opacity: 0; transform: scaleX(.85); transition: opacity .5s .1s, transform .6s .1s; }
    #scroll .rod::before, #scroll .rod::after { content: ''; position: absolute; top: -4px; width: 16px; height: 28px; border-radius: 6px; background: var(--wood-dark); }
    #scroll .rod::before { left: -8px; } #scroll .rod::after { right: -8px; }
    #scroll .sheet { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 1.1s cubic-bezier(.22,.9,.3,1); }
    #scroll .sheet > div { overflow: hidden; min-height: 0; }
    #scroll .paper { margin: 0 12px; padding: 22px 24px 16px; background: linear-gradient(90deg, var(--paper-edge), var(--paper) 8%, var(--paper) 92%, var(--paper-edge)); box-shadow: inset 0 0 0 4px #e6c987; }
    #scroll.open { pointer-events: auto; }
    #scroll.open .rod { opacity: 1; transform: none; }
    #scroll.open .sheet { grid-template-rows: 1fr; }
    #who { font-weight: 800; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: #c2571a; }
    #ltitle { font-weight: 800; font-size: 26px; line-height: 1.1; margin: 4px 0 10px; }
    #ltext { font-weight: 500; font-size: 18px; line-height: 1.35; white-space: pre-line; }
    #ltext .hide { opacity: 0; }
    #nav { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; gap: 8px; }
    .dots { display: flex; gap: 7px; }
    .dot { width: 12px; height: 12px; background: #e6c987; border-radius: 3px; transition: .25s; }
    .dot.on { background: #ff8a1f; transform: scale(1.25); }
    .nbtn { font: 800 16px/1 'Baloo 2', sans-serif; border: 0; border-radius: 10px; padding: 10px 14px; background: #ff8a1f; color: #fff; cursor: pointer; box-shadow: 0 3px 0 #b85a0a; }
    .nbtn.ghost { background: #e6c987; color: var(--ink); box-shadow: 0 3px 0 #b99a55; }
    .nbtn:disabled { opacity: .35; cursor: default; }
    #ltitle, #ltext { transition: opacity .25s; }
    .swap #ltitle, .swap #ltext { opacity: 0; }


    #diagram { margin: 2px 0 8px; background: #fff8e6; border-radius: 14px; box-shadow: inset 0 0 0 3px #f0d9a0; padding: 6px 4px; }
    #diagram svg { width: 100%; height: auto; display: block; font-family: 'Baloo 2', sans-serif; }
    .dg-node { opacity: 0; animation: dgpop .55s cubic-bezier(.3,1.5,.5,1) forwards; }
    .dg-line { opacity: 0; animation: dgfade .5s forwards; }
    @keyframes dgpop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }
    @keyframes dgfade { to { opacity: 1; } }
    #ltext { min-height: 7.2em; }
    .btns { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
    #qtext { font-weight: 800; font-size: 21px; line-height: 1.2; margin: 6px 0 12px; }
    .opt { display: block; width: 100%; text-align: left; font: 700 18px/1.2 'Baloo 2', sans-serif; color: var(--ink); background: #fff; border: 3px solid #e6c987; border-radius: 14px; padding: 12px 14px; margin-bottom: 9px; cursor: pointer; transition: transform .15s, background .2s, border-color .2s; }
    .opt b { display: inline-block; width: 26px; height: 26px; line-height: 26px; text-align: center; border-radius: 8px; background: #ffd23f; margin-right: 10px; }
    .opt.hover { transform: scale(1.03); border-color: #ff8a1f; background: #fff3d6; }
    .opt.good { background: #c8f7c5; border-color: #2fbf4a; }
    .opt.bad { background: #ffd2d2; border-color: #e24a4a; animation: shake .4s; }
    @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    #qfeed { font-weight: 700; font-size: 16px; min-height: 2.6em; margin-top: 2px; color: #7d4a1f; }
    [hidden] { display: none !important; }

    /* hands */
    #cam { position: fixed; left: 14px; bottom: 14px; width: 150px; border-radius: 14px; border: 3px solid #fff; transform: scaleX(-1); z-index: 5; display: none; background: #0b4a7a; opacity: .9; }
    #cursor { position: fixed; left: 0; top: 0; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; z-index: 30; pointer-events: none; display: none; border: 4px solid #fff; background: conic-gradient(#ffd23f calc(var(--p, 0) * 360deg), #ffffff33 0); box-shadow: 0 0 0 3px #0b4a7a66; }
    #cursor::after { content: ''; position: absolute; inset: 12px; border-radius: 50%; background: #ffffffe6; }
    #cursor.palm { background: conic-gradient(#ff5fa2 calc(var(--p, 0) * 360deg), #ffffff33 0); }
    #toast { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); z-index: 25; background: #fff; color: #0b4a7a; font-weight: 700; padding: 10px 16px; border-radius: 12px; display: none; max-width: 90vw; text-align: center; }
    .chip.hover { transform: translateY(-2px) scale(1.06); background: #fff; }

    @media (max-aspect-ratio: 1/1) {
      #scroll { right: 50%; left: auto; top: auto; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(50%); width: min(94vw, 480px); }
      #ltext { font-size: 18px; min-height: 7em; }
      #ltitle { font-size: 22px; }
      #hint { display: none; }
    }

    /* start overlay */
    #start { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; text-align: center; background: radial-gradient(circle at 50% 40%, #4fd0ff 0%, #1368b5 100%); transition: opacity .8s; cursor: pointer; }
    #start.gone { opacity: 0; pointer-events: none; }
    #start h1 { font-size: clamp(44px, 9vw, 92px); margin: 0; color: #fff; text-shadow: 0 6px 0 #0b4a7a; line-height: .95; }
    #start p { color: #e8fbff; font-weight: 700; font-size: 20px; margin: 18px 0 26px; }
    #start .go { display: inline-block; font-weight: 800; font-size: 22px; padding: 14px 30px; border-radius: 16px; background: #ffd23f; color: #5a3b00; border: 4px solid #fff7c9; box-shadow: 0 6px 0 #b8891a; animation: bob 1.6s infinite; }
    @keyframes bob { 50% { transform: translateY(-6px); } }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>

  <div id="bar"></div>
  <div id="hint">Pick a fish to learn about AI agents · Esc sends the fish home<br>🖐 Hands: point &amp; hold on a fish · ✌️ two fingers = quiz · open hand = done</div>

  <div id="scroll" aria-live="polite">
    <div class="rod"></div>
    <div class="sheet"><div>
      <div class="paper">
        <div id="who"></div>
        <div id="ltitle"></div>
        <div id="lesson">
          <div id="diagram"></div>
          <div id="ltext"></div>
        </div>
        <div id="quiz" hidden>
          <div id="qtext"></div>
          <div id="opts"></div>
          <div id="qfeed"></div>
        </div>
        <div class="btns">
          <button class="nbtn" id="quizbtn">✌️ Quiz me</button>
          <button class="nbtn ghost" id="done">🖐 Done</button>
        </div>
      </div>
    </div></div>
    <div class="rod"></div>
  </div>

  <video id="cam" playsinline muted></video>
  <div id="cursor"></div>
  <div id="toast"></div>

  <div id="start"><div>
    <h1>AI<br>Aquarium</h1>
    <p>Little voxel fish teach you AI. 🔊 Sound on.</p>
    <span class="go">Dive in</span>
  </div></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
